<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAYTI - مدير تجارة الطحين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        input { background-color: #2d2d2d; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; width: 100%; }
        .btn-primary { background-color: #3b82f6; color: white; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; }
        .negative-balance { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto p-4">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-500">BAYTI</h1>
            <p class="text-gray-400 text-sm">مدير تجارة الطحين</p>
        </div>

        <div class="card">
            <h2 class="text-lg mb-3">📦 المخزون الحالي</h2>
            <div id="stock-list" class="space-y-2 text-sm text-gray-300">
                </div>
        </div>

        <div class="card">
            <h2 class="text-lg mb-2">💰 حساب الزبون</h2>
            <div class="flex justify-between items-center">
                <span>الرصيد الحالي:</span>
                <span id="total-debt" class="text-xl text-green-400">0.00 MAD</span>
            </div>
            <p class="text-[10px] text-gray-500 mt-2">* الحساب لا يقل عن 0.00 MAD (Logic Fix)</p>
        </div>

        <div class="card">
            <h2 class="text-lg mb-3">🔄 إرجاع سلع (RETOUR)</h2>
            <input type="number" id="return-kg" placeholder="الكمية بالـ Kg" class="mb-3">
            <button onclick="calculateReturn()" class="btn-primary">حسب ونقص من الدين</button>
        </div>
    </div>

    <script>
        // Logic: Zero-Floor Balance & Auto-Calculation
        let currentDebt = 5000.00; // مثال
        const unitPrice = 5.50; // ثمن الكيلو مثال

        function updateUI() {
            // منع الرصيد السالب
            const displayDebt = currentDebt < 0 ? 0 : currentDebt;
            document.getElementById('total-debt').innerText = displayDebt.toFixed(2) + " MAD";
        }

        function calculateReturn() {
            const kg = parseFloat(document.getElementById('return-kg').value) || 0;
            const returnValue = kg * unitPrice; // حساب أوتوماتيكي
            currentDebt -= returnValue;
            updateUI();
            alert("تم خصم " + returnValue.toFixed(2) + " MAD من الحساب");
        }

        updateUI();
    </script>
</body>
</html>
